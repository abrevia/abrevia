<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrevia | Panel de Operaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Encabezado Superior -->
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded-md text-sm tracking-wider">AB</span>
            <span class="text-lg font-semibold tracking-tight">Abrevia</span>
            <span class="text-xs bg-blue-500/10 text-blue-400 px-2.5 py-1 rounded-full border border-blue-500/20">Panel Seguro</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <span class="text-slate-400">Estado: <strong class="text-emerald-400">Activo (ZDR)</strong></span>
            <a href="index.html" class="text-slate-400 hover:text-white transition text-xs">Inicio</a>
        </div>
    </header>

    <!-- Espacio Principal de Trabajo -->
    <div class="flex flex-grow overflow-hidden">
        
        <!-- Barra Lateral: Conversaciones -->
        <aside class="w-80 bg-slate-950/60 border-r border-slate-800 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Sesiones Activas</h2>
                <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-medium px-2 py-0.5 rounded-full border border-emerald-500/20">En vivo</span>
            </div>
            
            <div class="flex-grow overflow-y-auto p-3 space-y-2">
                <div class="w-full text-left bg-blue-600/10 border border-blue-500/30 p-3 rounded-xl cursor-pointer">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-semibold text-sm text-white">Ref #2637</span>
                        <span class="text-[10px] text-blue-400 font-medium">Activa</span>
                    </div>
                    <p class="text-xs text-slate-400">+1 (555) 011-2637</p>
                </div>
            </div>

            <div class="p-4 border-t border-slate-800">
                <button class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white text-xs font-medium py-2.5 rounded-xl transition">
                    + Nueva Conversación
                </button>
            </div>
        </aside>

        <!-- Área Central de Chat -->
        <main class="flex-grow flex flex-col bg-slate-900 justify-between overflow-hidden">
            
            <!-- Barra Superior del Ticket -->
            <div class="bg-slate-950/40 border-b border-slate-800 px-6 py-4 flex justify-between items-center shrink-0">
                <div>
                    <h2 class="font-bold text-base text-white">Ticket #2637</h2>
                    <p class="text-xs text-slate-400">Canal: SMS Directo Gateway</p>
                </div>
                <button id="purgeBtn" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 text-xs font-medium px-3.5 py-2 rounded-lg transition">
                    Cerrar y Purgar Sesión
                </button>
            </div>

            <!-- Contenedor del Historial de Mensajes -->
            <div id="chatFeed" class="flex-grow overflow-y-auto p-6 space-y-4">
                <div class="text-center">
                    <span class="bg-slate-800/80 text-slate-400 text-[11px] px-3 py-1 rounded-full border border-slate-700/50">
                        Protocolo ZDR activo: sin almacenamiento en disco
                    </span>
                </div>
            </div>

            <!-- Barra Inferior de Entrada -->
            <div class="bg-slate-950 border-t border-slate-800 p-4 shrink-0">
                <form id="chatForm" class="max-w-5xl mx-auto flex items-center space-x-3 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 focus-within:border-blue-500 transition">
                    <button type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium px-3.5 py-2 rounded-lg border border-slate-700 shrink-0">
                        Adjuntar
                    </button>
                    <input id="messageInput" type="text" placeholder="Escribe el mensaje aquí..." class="w-full bg-transparent text-sm text-white focus:outline-none" autocomplete="off">
                    <button type="submit" id="sendBtn" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition shrink-0">
                        Enviar
                    </button>
                </form>
            </div>

        </main>
    </div>

    <!-- Enlace al archivo de lógica -->
    <script src="app.js"></script>
</body>
</html>
